name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite is fully offline: no nba_api calls, no cached data, no Yahoo
# credentials. It only needs the Python dependencies.

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
